name: hear_the_sound
description: "A new Flutter project."
publish_to: 'none'
# Sürüm disiplini: `+N` (build numarası) HER yayında bir artar — zorunlu
# güncelleme kapısı (§20) sürümleri bu MONOTONİK tamsayıyla karşılaştırır
# (semver string ayrıştırması yok). Sunucudaki app_config.min_supported_build
# bu sayıyla kıyaslanır.
version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  audioplayers: ^6.6.0
  dart_melty_soundfont: ^2.0.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter:
    sdk: flutter
  flutter_local_notifications: ^20.1.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  flutter_timezone: ^5.1.0
  google_fonts: ^6.3.2
  google_sign_in: ^7.2.0
  package_info_plus: ^9.0.1
  path_provider: ^2.1.5
  pitch_detector_dart: ^0.0.7
  record: ^6.2.1
  share_plus: ^12.0.2
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.15.4
  timezone: ^0.10.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    # Gerçek piyano tınısı (GeneralUser GS — lisansı uygulama içinde
    # paketlemeye izin verir; bkz. assets/sf2/ATTRIBUTION.md).
    - assets/sf2/GeneralUser-GS.sf2
